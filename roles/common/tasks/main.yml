---

- name: Assert sysadmins are named
  ansible.builtin.fail: msg="sysadmins must be listed"
  when: not (sysadmins | length)
  tags: common

- name: Assert service account is named
  ansible.builtin.fail: msg="ansible_service_account must be named and list public_keys"
  when: not (ansible_service_account.user and ansible_service_account.public_keys | length)
  tags: common

- name: Configure sysadmin accounts
  ansible.builtin.user:
    name: "{{ item.user }}"
    state: present
    groups: sudo
    append: true
    shell: /bin/bash
  with_items: "{{ sysadmins }}"
  tags: common

- name: Set (exclusive) ~/.ssh/authorized_keys for sysadmins
  ansible.posix.authorized_key:
    user: "{{ item.user }}"
    key: "{{ item.id_rsa_pub }}"
    exclusive: yes
  with_items: "{{ sysadmins }}"
  tags: common

- name: Ensure service account user for Ansible exists
  ansible.builtin.user:
    name: "{{ ansible_service_account.user }}"
    groups: sudo
    state: present
    comment: "{{ ansible_service_account.comment }}"
    shell: /bin/bash
  tags: common

- name: Set (exclusive) ~/.ssh/authorized_keys for Ansible service account
  ansible.posix.authorized_key:
    user: "{{ ansible_service_account.user }}"
    state: present
    key: "{{ ansible_service_account.public_keys | join('\n') }}"
    exclusive: yes
  tags: common

- name: Allow passwordless sudo for Ansible service account
  ansible.builtin.lineinfile:
    dest: /etc/sudoers
    state: present
    regexp: '^{{ ansible_service_account.user }} ALL=\(ALL\) NOPASSWD: ALL'
    line: "{{ ansible_service_account.user }} ALL=(ALL) NOPASSWD: ALL"
    validate: "visudo -cf %s"
  become: yes
  tags: common

- name: Remove ~/.ssh/authorized_keys for 'root' user
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys
    state: absent
  tags: common

- name: Disable root login and password authentication for sudoers in /etc/ssh/sshd_config
  ansible.builtin.blockinfile:
    dest: /etc/ssh/sshd_config.d/50-cloud-init.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK common"
    block: |
      PermitRootLogin no
      LoginGraceTime 10
      MaxAuthTries 2
      AllowUsers {{ sysadmins | map(attribute='user') | join(' ') + ' ' + ansible_service_account.user }}
      Match Group sudo
      	PasswordAuthentication no
  register: sshd_config_hardening
  tags: common

# Ubuntu 24.04 socket-activates SSH: ssh.socket is enabled and ssh.service is
# not, so the 'sshd' alias that enabling ssh.service would create may not
# exist. 'ssh' is the unit's own name on every Ubuntu release.
- name: Restart sshd to apply config changes
  ansible.builtin.service: name=ssh state=restarted
  when: sshd_config_hardening is changed
  tags: common

- name: Set timezone to Europe/Stockholm
  community.general.timezone:
    name: Europe/Stockholm
  tags: common

- name: Generate the en_US.UTF-8 locale
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present
  tags: common

- name: Set en_US.UTF-8 as default system locale
  ansible.builtin.copy:
    content: "LANG=en_US.UTF-8\n"
    dest: /etc/default/locale
  tags: common

- name: Install base packages
  ansible.builtin.apt:
    name:
      - acl
      - btop
      - htop
      - tree
      - dlocate
      - jq
      - emacs
      - pigz
      - unzip
      - wget
      - net-tools
      - nethogs
      - parallel
      - inetutils-traceroute
      - python3-venv
      - python3-kubernetes
      - bzip2
      - make
      - gcc
      - xsel
      - smartmontools
      - lm-sensors
      - ubuntu-server
    autoremove: true
    state: present
  tags: common

- name: Ensure firewalld is not installed, as it conflicts with Calico iptables networking
  ansible.builtin.apt:
    name:
      - firewalld
      - python3-firewall
    state: absent
  tags: common

# The nodes are consumer mini PCs, and the kernel treats a12c's AMD SATA
# controller as a laptop chipset: its links came up with link power management
# enabled, a suspect in the CRC errors and link resets that a12c's SATA SSD
# logged on 2026-11-02. These run around the clock, so pin every SATA link to
# full power. See docs/hacks-and-troubleshooting.md.
- name: Keep SATA links at full power instead of link power management
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/60-sata-link-power.rules
    content: |
      # Managed by Ansible (minio-microk8s-ansible, role common).
      # Keep SATA links at full power; see docs/hacks-and-troubleshooting.md.
      ACTION=="add", SUBSYSTEM=="scsi_host", KERNEL=="host*", \
        ATTR{link_power_management_policy}=="?*", \
        ATTR{link_power_management_policy}="max_performance"
    mode: "0644"
  register: sata_link_power_rule
  tags: common

# A port without a device rejects the write ("Operation not supported"); udev
# logs that and carries on with the other ports.
- name: Apply the SATA link power rule without a reboot
  ansible.builtin.shell: >-
    udevadm control --reload &&
    udevadm trigger --settle --subsystem-match=scsi_host --action=add
  when: sata_link_power_rule is changed
  tags: common

# The Realtek r8125 driver that ar9708-r8125-hack builds on a12c and a12d is
# compiled with Energy Efficient Ethernet on; the Intel igc NICs on a12a and
# a12b already have it off, and the option is inert where r8125 is not loaded.
# The hack reloads r8125 on every boot, so this takes effect at the next
# reboot without disturbing the running link.
- name: Disable Energy Efficient Ethernet in the Realtek r8125 driver
  ansible.builtin.copy:
    dest: /etc/modprobe.d/r8125.conf
    content: |
      # Managed by Ansible (minio-microk8s-ansible, role common).
      # No Energy Efficient Ethernet; see docs/hacks-and-troubleshooting.md.
      options r8125 eee_enable=0
    mode: "0644"
  tags: common

# Nothing suspends these servers today, but logind's default
# HandleSuspendKey=suspend would act on a keyboard's sleep key.
- name: Mask the sleep, suspend and hibernate targets
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
  with_items:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target
  tags: common

...
