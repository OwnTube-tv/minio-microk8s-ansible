---

- name: Gather package facts to find MinIO server
  ansible.builtin.package_facts:
    manager: apt
  tags: minio-server

- name: Install MinIO server
  ansible.builtin.apt:
    deb: '{{ minio_server_deb_package }}'
    state: present
  when: '"minio" not in ansible_facts.packages'
  notify: Restart MinIO service
  tags: minio-server

- name: Create MinIO service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/minio.service.d
    state: directory
    owner: root
    group: root
    mode: 0755
  tags: minio-server

- name: Configure MinIO service restart policy
  ansible.builtin.copy:
    dest: /etc/systemd/system/minio.service.d/override.conf
    owner: root
    group: root
    mode: 0644
    content: |
      # The packaged unit restarts every 100 ms and gives up after 5 failed
      # starts within 10 s, leaving the service permanently failed when it
      # exits quickly at boot (LAN NIC without address or cluster peers not
      # up yet). Retry every 10 s instead, and never stop retrying.
      [Unit]
      StartLimitIntervalSec=0

      [Service]
      RestartSec=10s
  notify: Reload systemd daemon
  tags: minio-server

- name: Determine the designated initial master host
  ansible.builtin.set_fact:
    designated_host: '{{ (groups[minio_servers_group] | sort)[0] }}'
  tags: minio-server

- name: Create ingress for MinIO server, https://minio.owntube.tv
  kubernetes.core.k8s:
    definition: "{{ item }}"
    state: present
  loop: "{{ lookup('file', 'minio-host-access-ingress.yml') | from_yaml_all }}"
  when: inventory_hostname == designated_host
  tags: minio-server

- name: Set MinIO service to started and enabled
  ansible.builtin.service:
    name: minio
    enabled: yes
    state: started
  tags: minio-server

...
