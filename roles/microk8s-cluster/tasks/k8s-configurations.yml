---

- name: Create root .kube folder for the MicroK8s designated initial host
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: 0750
  # Every kubernetes.core.k8s task below reads this kubeconfig, in check mode
  # too. Skipping these two would leave whatever the file happened to contain
  # from an earlier run — a stale API server address then fails the check.
  check_mode: no
  tags: microk8s-cluster

- name: Create root kubectl config for the MicroK8s designated host
  ansible.builtin.shell: microk8s config > /root/.kube/config
  args:
    executable: /bin/bash
  changed_when: no
  check_mode: no
  tags: microk8s-cluster

- name: Create Let's Encrypt issuer for cert-manager
  kubernetes.core.k8s:
    definition: "{{ lookup('file', 'letsencrypt-cluster-issuer.yml') | from_yaml }}"
    state: present
  when: create_letsencrypt_issuer
  tags: microk8s-cluster

- name: Add 'host.local' to CoreDNS ConfigMap for MicroK8s 'host-access' add-on compatibility
  kubernetes.core.k8s:
    definition: "{{ lookup('file', 'coredns-host-access-fallthrough.yml') | from_yaml }}"
    state: present
  tags: microk8s-cluster

- name: Create ingress for Kubernetes Dashboard, https://k8s-dashboard.owntube.tv
  kubernetes.core.k8s:
    definition: "{{ lookup('file', 'k8s-dashboard-ingress.yml') | from_yaml }}"
    state: present
  when: create_dashboard_ingress
  tags: microk8s-cluster

- name: Create long-lived token secret for Kubernetes Dashboard (K8s 1.24+)
  kubernetes.core.k8s:
    definition: "{{ lookup('file', 'k8s-dashboard-token.yml') | from_yaml }}"
    state: present
  when: create_dashboard_ingress
  tags: microk8s-cluster

...
